name: Capture LC 214 source

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: Request timeout in seconds
        required: false
        default: "45"
        type: string

permissions:
  contents: read

concurrency:
  group: capture-camara-lc214
  cancel-in-progress: false

jobs:
  capture-lc214:
    name: Archive official compiled LC 214 text
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/tax-data/uv.lock

      - name: Install locked Python environment
        run: uv sync --locked --project packages/tax-data

      - name: Capture source once
        id: capture
        shell: bash
        env:
          CAPTURE_TIMEOUT: ${{ inputs.timeout || '45' }}
        run: |
          set -euo pipefail
          uv run --project packages/tax-data contai-tax-data capture-lc214 \
            --output var/tax-data \
            --timeout "$CAPTURE_TIMEOUT" \
            | tee capture-result.json
          {
            echo '## Captura bruta LC 214/2025'
            echo
            echo 'Texto compilado oficial arquivado sem extração jurídica e sem escrita no Supabase.'
            echo
            echo '```json'
            cat capture-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract literal structural blocks
        shell: bash
        run: |
          set -euo pipefail
          uv run --project packages/tax-data python - <<'PY'
          import json
          from pathlib import Path
          from contai_tax_data.federal_law import write_lc214_blocks

          root = Path("var/tax-data/laws/lc214")
          observation = json.loads((root / "state/lc214-latest-capture.json").read_text(encoding="utf-8"))
          captured_at = observation["captured_at"].replace(":", "-")
          observation_path = root / "artifacts/observations" / observation["artifact_sha256"] / f"{captured_at}.json"
          result = write_lc214_blocks(root / observation["raw_path"], observation_path, root)
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
          {
            echo '### Extração estrutural literal'
            echo
            echo 'Blocos publicados como artefato de execução; nenhuma vigência ou efeito jurídico foi inferido.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture linked official records
        shell: bash
        env:
          CAPTURE_TIMEOUT: ${{ inputs.timeout || '45' }}
        run: |
          set -euo pipefail
          uv run --project packages/tax-data contai-tax-data capture-lc214-records \
            --output var/tax-data \
            --timeout "$CAPTURE_TIMEOUT" \
            | tee linked-records-result.json
          {
            echo '### Publicações oficiais relacionadas'
            echo
            echo 'Capturas separadas do texto original, mensagem de veto e promulgação dos vetos.'
            echo
            echo '```json'
            cat linked-records-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lc214-capture-${{ github.run_id }}
          path: var/tax-data/laws/lc214/
          if-no-files-found: error
          retention-days: 14
