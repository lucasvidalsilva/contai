name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tax-data:
    name: Python tax-data and database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            packages/tax-data/uv.lock
            packages/fiscal-engine/uv.lock

      - name: Install locked Python environment
        run: |
          uv sync --locked --project packages/tax-data
          uv sync --locked --project packages/fiscal-engine

      - name: Check fiscal-engine lockfile
        run: uv lock --check --project packages/fiscal-engine

      - name: Lint
        run: uv run --project packages/tax-data ruff check packages/tax-data packages/fiscal-engine

      - name: Check formatting
        run: uv run --project packages/tax-data ruff format --check packages/tax-data packages/fiscal-engine

      - name: Type check
        run: |
          uv run --project packages/tax-data mypy packages/tax-data/src
          uv run --project packages/fiscal-engine mypy packages/fiscal-engine/src

      - name: Unit and offline integration tests
        run: |
          uv run --project packages/tax-data pytest --rootdir packages/tax-data packages/tax-data/tests
          uv run --project packages/fiscal-engine pytest --rootdir packages/fiscal-engine packages/fiscal-engine/tests

      - name: Install locked Node development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test PostgreSQL migration and role boundaries
        run: npm run test:db-schema

      - name: Test PostgreSQL staging and publication flow
        run: npm run test:db-integration

      - name: Validate GitHub Actions workflows
        run: npm run test:workflows

  desktop:
    name: Tauri desktop application
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/fiscal-engine/uv.lock

      - name: Install locked dependencies
        run: |
          uv sync --locked --project packages/fiscal-engine
          npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund

      - name: Check and test frontend
        run: |
          npm --prefix apps/desktop run check
          npm --prefix apps/desktop run lint
          npm --prefix apps/desktop run test
          npm --prefix apps/desktop run build

      - name: Build and verify fiscal sidecar
        run: |
          npm --prefix apps/desktop run sidecar:build
          npm --prefix apps/desktop run sidecar:verify

      - name: Check and test Rust backend
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Compile Tauri release
        run: npm --prefix apps/desktop run tauri -- build --no-bundle
