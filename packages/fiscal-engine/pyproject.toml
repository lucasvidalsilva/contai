[project]
name = "contai-fiscal-engine"
version = "0.1.0"
description = "Verificações locais e determinísticas de NF-e para o contAI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lxml==6.1.3",
]

[project.scripts]
contai-fiscal-engine = "contai_fiscal_engine.cli:main"

[dependency-groups]
dev = [
  "lxml-stubs==0.5.1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
